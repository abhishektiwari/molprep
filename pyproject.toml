[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molprep"
dynamic = ["version"]
description = "A Python package for streamlined preparation of protein structures and drug-like molecules for virtual screening workflows"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Abhishek Tiwari", email = "abhishek@abhishek-tiwari.com"}
]
keywords = ["molecular modeling", "drug discovery", "virtual screening", "protein preparation", "cheminformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
lint = [
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/abhishektiwari/molprep"
Documentation = "https://molprep.readthedocs.io"
Repository = "https://github.com/abhishektiwari/molprep"
Issues = "https://github.com/abhishektiwari/molprep/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["molprep*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.src]
include = ["molprep", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=molprep --cov-report=html --cov-report=term-missing"

[tool.setuptools_scm]
write_to = "molprep/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
