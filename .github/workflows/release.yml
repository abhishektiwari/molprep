name: Build and Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  push:
    branches: [ main ]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up uv and Python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.14'
        enable-cache: false

    - name: Sync dependencies
      run: uv sync --locked

    - name: Run checks
      run: make check

  generate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      version_tag: ${{ steps.generate_version.outputs.version_tag }}
      github_tag: ${{ steps.generate_version.outputs.github_tag }}
      is_prerelease: ${{ steps.generate_version.outputs.is_prerelease }}
      pr_number: ${{ github.event.number }}
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false
    
    - name: Generate version for PR
      if: github.event_name == 'pull_request'
      id: generate_pr_version
      env:
        PR_NUMBER: ${{ github.event.number }}
      run: |
        # Get base version from the highest stable release tag (vX.Y.Z only, no prerelease
        # suffix). git describe picks the nearest tag by commit distance, which can pick up
        # a stale prerelease tag from an earlier push to this same PR and compound its rc
        # suffix — so we ignore ancestry entirely and version-sort all stable tags instead.
        BASE_VERSION=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 | sed 's/^v//')
        BASE_VERSION=${BASE_VERSION:-0.0.0}

        # Generate PEP 440 compatible pre-release version with timestamp
        TIMESTAMP=$(date +%s)

        # Use PEP 440 compatible format with PR number and timestamp
        PRERELEASE_VERSION="${BASE_VERSION}rc${PR_NUMBER}${TIMESTAMP}"
        PRERELEASE_TAG="v${PRERELEASE_VERSION}"

        # GitHub tag for releases (with PR number and timestamp)
        GITHUB_TAG="v${PRERELEASE_VERSION}"

        {
          echo "version=$PRERELEASE_VERSION"
          echo "version_tag=$PRERELEASE_TAG"
          echo "github_tag=$GITHUB_TAG"
          echo "is_prerelease=true"
        } >> "$GITHUB_OUTPUT"
    
    - name: Generate version for release
      if: github.event_name == 'push'
      id: generate_release_version
      uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
      with:
        tag_prefix: "v"
        major_pattern: "(MAJOR)"
        minor_pattern: "(MINOR)"
        version_format: "${major}.${minor}.${patch}"
        bump_each_commit: true
    
    - name: Set outputs
      id: generate_version
      run: |
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          {
            echo "version=${STEPS_GENERATE_PR_VERSION_OUTPUTS_VERSION}"
            echo "version_tag=${STEPS_GENERATE_PR_VERSION_OUTPUTS_VERSION_TAG}"
            echo "github_tag=${STEPS_GENERATE_PR_VERSION_OUTPUTS_GITHUB_TAG}"
            echo "is_prerelease=true"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "version=${STEPS_GENERATE_RELEASE_VERSION_OUTPUTS_VERSION}"
            echo "version_tag=${STEPS_GENERATE_RELEASE_VERSION_OUTPUTS_VERSION_TAG}"
            echo "github_tag=${STEPS_GENERATE_RELEASE_VERSION_OUTPUTS_VERSION_TAG}"
            echo "is_prerelease=false"
          } >> "$GITHUB_OUTPUT"
        fi
      env:
        EVENT_NAME: ${{ github.event_name }}
        STEPS_GENERATE_PR_VERSION_OUTPUTS_VERSION: ${{ steps.generate_pr_version.outputs.version }}
        STEPS_GENERATE_PR_VERSION_OUTPUTS_VERSION_TAG: ${{ steps.generate_pr_version.outputs.version_tag }}
        STEPS_GENERATE_PR_VERSION_OUTPUTS_GITHUB_TAG: ${{ steps.generate_pr_version.outputs.github_tag }}
        STEPS_GENERATE_RELEASE_VERSION_OUTPUTS_VERSION: ${{ steps.generate_release_version.outputs.version }}
        STEPS_GENERATE_RELEASE_VERSION_OUTPUTS_VERSION_TAG: ${{ steps.generate_release_version.outputs.version_tag }}

  build-python:
    needs: [verify, generate-version]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false
    
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.11'
        enable-cache: false

    - name: Sync dependencies
      run: uv sync --locked
    
    - name: Set version for setuptools-scm
      env:
        VERSION_TAG: ${{ needs.generate-version.outputs.version_tag }}
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        echo "About to create tag: $VERSION_TAG"
        git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
        echo "Created tag: $VERSION_TAG"
    
    - name: Build package
      run: make build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: python-artifacts
        path: dist/*
        retention-days: 30
    
    - name: Publish to PyPI
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        attestations: true
        skip-existing: true

  create-release:
    needs: [generate-version, build-python]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Download Python artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: python-artifacts
        path: dist/
       
    - name: List all artifacts
      run: |
        echo "Contents of dist directory:"
        find dist -type f -ls
    
    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: dist/**/*
        tag_name: ${{ needs.generate-version.outputs.github_tag }}
        name: ${{ needs.generate-version.outputs.is_prerelease == 'true' && 'Pre-release' || 'Release' }} ${{ needs.generate-version.outputs.github_tag }}
        body: |
          ${{ needs.generate-version.outputs.is_prerelease == 'true' && format('🚧 **Pre-release build for PR #{0}**', needs.generate-version.outputs.pr_number) || '🎉 **New Release**' }}
          
          ${{ needs.generate-version.outputs.is_prerelease == 'true' && 'This is an automated pre-release build. Use for testing purposes only.' || github.event.head_commit.message }}
          
          ## Available Downloads
          
          ### Python Package
          - Wheel: `molprep-${{ needs.generate-version.outputs.version }}-py3-none-any.whl`
          - Source: `molprep-${{ needs.generate-version.outputs.version }}.tar.gz`
          
          ## Installation
          
          **PIP:**
          ```bash
          pip install https://github.com/${{ github.repository }}/releases/download/${{ needs.generate-version.outputs.github_tag }}/molprep-${{ needs.generate-version.outputs.version }}-py3-none-any.whl
          ```
          
          **PyPI:**
          ```bash
          pip install molprep${{ needs.generate-version.outputs.is_prerelease == 'true' && '==' || '' }}${{ needs.generate-version.outputs.is_prerelease == 'true' && needs.generate-version.outputs.version || '' }}
          ```

        prerelease: ${{ needs.generate-version.outputs.is_prerelease == 'true' }}
        draft: false
    
    - name: Comment on PR
      if: needs.generate-version.outputs.is_prerelease == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        PR_NUMBER: ${{ needs.generate-version.outputs.pr_number }}
        RELEASE_TAG: ${{ needs.generate-version.outputs.github_tag }}
        PACKAGE_VERSION: ${{ needs.generate-version.outputs.version }}
      with:
        script: |
          const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
          const tag = process.env.RELEASE_TAG;
          const version = process.env.PACKAGE_VERSION;
          
          const comment = `## 🚧 Pre-release Ready
          
          A pre-release has been created for this PR: **${tag}**
          
          ### Quick Install
          
          **From PyPI (recommended):**
          \`\`\`bash
          pip install molprep==${version}
          \`\`\`
          
          **From GitHub Release:**
          \`\`\`bash
          pip install https://github.com/${{ github.repository }}/releases/download/${tag}/molprep-${version}-py3-none-any.whl
          \`\`\`
          
          ### Available Artifacts
          - **Python**: wheel and source distribution
          
          View all artifacts at: https://github.com/${{ github.repository }}/releases/tag/${tag}
          `;
          
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
